# .github/workflows/update-badges.yml - Auto-update README badges

name: Update README Badges

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update GitHub Stats Badge
        run: |
          # This workflow keeps badges fresh by triggering repo updates
          echo "Badges are served from external services and update automatically"
          echo "This workflow ensures the repo stays 'active' for badge services"

      - name: Update Release Badge
        uses: actions/github-script@v9
        with:
          script: |
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 1
            });
            if (releases.length > 0) {
              console.log(`Latest release: ${releases[0].tag_name}`);
            }

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet README.md; then
            git add README.md
            git commit -m "chore: update README badges [skip ci]"
            git push
          else
            echo "No badge changes"
          fi